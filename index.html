        const calculateTimeGap = (prevEnd, nextStart) => {
            const [endH, endM] = prevEnd.split(':').map(Number);
            const [startH, startM] = nextStart.split(':').map(Number);
            let diff = (startH * 60 + startM) - (endH * 60 + endM);
            return diff > 0 ? diff : 0;
        };

        const calculateDuration = (start, end) => {
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let diff = (eH*60 + eM) - (sH*60 + sM);
            if(diff < 0) diff += 1440;
            const h = Math.floor(diff/60);
            const m = diff % 60;
            if(h>0) return `${h}h ${m>0 ? m+'m' : ''}`;
            return `${m} min`;
        };

        const calculateDistance = (lat1, lon1, lat2, lon2) => {
            if(!lat1 || !lon1 || !lat2 || !lon2) return 0;
            const R = 6371e3; // metres
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        };

        const isTimeActive = (startStr, endStr) => {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const [sH, sM] = startStr.split(':').map(Number);
            const [eH, eM] = endStr.split(':').map(Number);
            const startMins = sH * 60 + sM;
            const endMins = eH * 60 + eM;
            return currentMins >= startMins && currentMins < endMins;
        };
        
        const getProgress = (startStr, endStr) => {
             const now = new Date();
             const currentMins = now.getHours() * 60 + now.getMinutes();
             const [sH, sM] = startStr.split(':').map(Number);
             const [eH, eM] = endStr.split(':').map(Number);
             const startMins = sH * 60 + sM;
             const endMins = eH * 60 + eM;
             const total = endMins - startMins;
             const elapsed = currentMins - startMins;
             return Math.min(100, Math.max(0, (elapsed / total) * 100));
        };

        // --- COMPONENTS ---

        // 1. TIMELINE
        const Timeline = ({ itinerary, onToggleComplete, onLocate, onShowRoute, onShowDetails, userLocation }) => {
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();

            return (
                <div className="pb-24 px-4 pt-4 max-w-lg mx-auto">
                     {/* Timeline Line */}
                    <div className="relative border-l-2 border-slate-200 ml-4 space-y-0">
                        {itinerary.map((act, idx) => {
                            const nextAct = itinerary[idx + 1];
                            const gap = nextAct ? calculateTimeGap(act.endTime, nextAct.startTime) : 0;
                            const isActive = isTimeActive(act.startTime, act.endTime);
                            const progress = isActive ? getProgress(act.startTime, act.endTime) : 0;
                            
                            // Calculate Distance if user location exists
                            let distStr = null;
                            if (userLocation && act.coords) {
                                const d = calculateDistance(userLocation.lat, userLocation.lng, act.coords.lat, act.coords.lng);
                                distStr = d < 1000 ? `${Math.round(d)} m` : `${(d/1000).toFixed(1)} km`;
                            }

                            // Check if "NOW" line should be here (between acts)
                            const [eH, eM] = act.endTime.split(':').map(Number);
                            const actEndMins = eH * 60 + eM;
                            let showNowLine = false;
                            if (nextAct) {
                                const [nSH, nSM] = nextAct.startTime.split(':').map(Number);
                                const nextStartMins = nSH * 60 + nSM;
                                if (currentMins >= actEndMins && currentMins < nextStartMins) showNowLine = true;
                            }

                            return (
                                <div key={act.id} className="relative pl-6 pb-6">
                                    {/* Dot */}
                                    <div 
                                        className={`absolute -left-[9px] top-0 rounded-full bg-white border-2 cursor-pointer z-10 transition-colors ${
                                            act.completed ? 'border-mountain-500 text-mountain-500' : 'border-fjord-500 text-fjord-500'
                                        }`}
                                        onClick={(e) => { e.stopPropagation(); onToggleComplete(act.id); }}
                                    >
                                        {act.completed ? <Icons.CheckCircle2 size={20} /> : <Icons.Circle size={20} />}
                                    </div>

                                    {/* Card */}
                                    <div 
                                        onClick={() => onShowDetails(act)}
                                        className={`rounded-xl border shadow-sm p-4 active:scale-[0.98] transition-all relative overflow-hidden ${
                                            isActive 
                                            ? 'bg-white border-fjord-500 ring-2 ring-fjord-200 shadow-md' 
                                            : act.completed ? 'bg-slate-50 border-slate-200 opacity-70' : 'bg-white border-slate-200'
                                        }`}
                                    >
                                        {/* Active Progress Bar Background */}
                                        {isActive && (
                                            <div className="absolute bottom-0 left-0 h-1 bg-fjord-100 w-full">
                                                <div className="h-full bg-fjord-500 transition-all duration-1000" style={{width: `${progress}%`}}></div>
                                            </div>
                                        )}

                                        <div className="flex flex-col mb-2">
                                            <div className="flex flex-wrap items-center gap-2 mb-2">
                                                <span className={`text-xs font-bold px-2 py-0.5 rounded ${isActive ? 'bg-fjord-600 text-white' : 'bg-slate-100 text-slate-600'}`}>
                                                    {act.startTime} - {act.endTime}
                                                </span>
                                                <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600 border border-slate-200 flex items-center">
                                                     ⏱ {calculateDuration(act.startTime, act.endTime)}
                                                </span>
                                                {distStr && (
                                                     <span className="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-600 border border-blue-100 flex items-center">
                                                        <Icons.Nav size={10} className="mr-1"/> a {distStr}
                                                     </span>
                                                )}
                                                {isActive && <span className="text-[10px] font-bold text-fjord-600 animate-pulse">⚡ EN CURSO</span>}
                                                {act.notes === 'CRITICAL' && <Icons.AlertTriangle size={14} className="text-red-500" />}
                                            </div>
                                            <h3 className="font-bold text-lg leading-tight text-slate-800">{act.title}</h3>
                                        </div>

                                        {/* Location */}
                                        <div className="flex items-center text-sm text-slate-500 mb-3 gap-1 flex-wrap">
                                            <Icons.MapPin size={14} /> 
                                            <span>{act.locationName}</span>
                                            {act.endLocationName && (
                                                <>
                                                    <Icons.ArrowRight size={12} className="mx-1" />
                                                    <span>{act.endLocationName}</span>
                                                </>
                                            )}
                                        </div>

                                        {/* Buttons */}
                                        <div className="flex gap-2 mt-3 overflow-x-auto scrollbar-hide pb-1">
                                            <button 
                                                onClick={(e) => { e.stopPropagation(); onLocate(act.coords); }}
                                                className="px-3 py-1.5 bg-fjord-50 text-fjord-700 text-xs font-bold rounded flex items-center whitespace-nowrap"
                                            >
                                                <Icons.MapPin size={14} className="mr-1" /> Ubicación
                                            </button>
                                            
                                            {act.googleMapsUrl && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); window.open(act.googleMapsUrl, '_blank'); }}
                                                    className="px-3 py-1.5 bg-green-50 text-green-700 text-xs font-bold rounded flex items-center whitespace-nowrap"
                                                >
                                                    🗺️ Ruta
                                                </button>
                                            )}

                                            {act.ticketUrl && (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); window.open(act.ticketUrl, '_blank'); }}
                                                    className="px-3 py-1.5 bg-orange-50 text-orange-700 text-xs font-bold rounded flex items-center whitespace-nowrap"
                                                >
                                                    <Icons.Ticket size={14} className="mr-1" /> Ticket
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Gap Connector */}
                                    {gap > 0 && (
                                        <div className="absolute left-[3px] -bottom-[12px] w-full z-10 pointer-events-none">
                                            <div className="flex items-center">
                                                <div className="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-200 shadow-sm flex items-center gap-1">
                                                    <Icons.ArrowDown size={10} /> {gap} min traslado/libre
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* NOW Line Indicator */}
                                    {showNowLine && (
                                        <div className="absolute left-0 w-full flex items-center z-20 -mt-3 pointer-events-none">
                                            <div className="w-full border-t-2 border-red-500 border-dashed"></div>
                                            <span className="absolute right-0 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-l shadow">
                                                🕒 AHORA {now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                            </span>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // 2. BUDGET
        const Budget = ({ itinerary }) => {
            const [currency, setCurrency] = useState('DKK'); // View currency for list
            
            // Calculator State (Independent)
            const [calcMode, setCalcMode] = useState('DKK_TO_EUR');
            const [convAmount, setConvAmount] = useState('');
            
            const [manualExpenses, setManualExpenses] = useState([]);
            const [newItemName, setNewItemName] = useState('');
            const [newItemPrice, setNewItemPrice] = useState('');

            // Filter itinerary items that have a cost
            const costItems = useMemo(() => itinerary.filter(i => i.priceDKK > 0 || i.priceEUR > 0), [itinerary]);
            
            // Initial toggle state: Default UNCHECKED (User checks them as they pay)
            const [checkedItems, setCheckedItems] = useState({});

            const toggleCheck = (id) => {
                setCheckedItems(prev => ({...prev, [id]: !prev[id]}));
            };

            const addManualExpense = () => {
                if(!newItemName || !newItemPrice) return;
                const price = parseFloat(newItemPrice);
                if(isNaN(price)) return;
                setManualExpenses([...manualExpenses, { id: Date.now(), title: newItemName, price, currency: currency }]);
                setNewItemName('');
                setNewItemPrice('');
            };

            // Rates
            const RATE_DKK_TO_EUR = 7.46; // 1 EUR = 7.46 DKK

            const convert = (val, from, to) => {
                 if (from === to) return val;
                 if (from === 'EUR' && to === 'DKK') return val * RATE_DKK_TO_EUR;
                 if (from === 'DKK' && to === 'EUR') return val / RATE_DKK_TO_EUR;
                 return val;
            };

            // Calculator Result Logic
            const getCalcResult = () => {
                const val = parseFloat(convAmount);
                if(isNaN(val)) return '---';
                if(calcMode === 'DKK_TO_EUR') {
                    // DKK input -> EUR output
                    return (val / RATE_DKK_TO_EUR).toFixed(2) + ' €';
                } else {
                    // EUR input -> DKK output
                    return (val * RATE_DKK_TO_EUR).toFixed(0) + ' kr';
                }
            }

            // Calculate totals
            let totalBudget = 0;
            let totalSpent = 0;

            // From Itinerary
            costItems.forEach(item => {
                const price = currency === 'DKK' ? item.priceDKK : item.priceEUR;
                totalBudget += price;
                if (checkedItems[item.id]) totalSpent += price;
            });

            // From Manual
            manualExpenses.forEach(item => {
                const price = convert(item.price, item.currency, currency);
                totalBudget += price; 
                totalSpent += price;
            });

            return (
                <div className="pb-24 px-4 pt-6 max-w-lg mx-auto overflow-y-auto h-full">
                    {/* Header */}
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-fjord-500 flex items-center gap-2">
                           <Icons.Wallet /> Gastos
                        </h2>
                        <div className="bg-slate-200 p-1 rounded-lg flex">
                            <button onClick={()=>setCurrency('DKK')} className={`px-3 py-1 rounded font-bold text-sm ${currency==='DKK'?'bg-white shadow text-fjord-600':'text-slate-500'}`}>DKK kr</button>
                            <button onClick={()=>setCurrency('EUR')} className={`px-3 py-1 rounded font-bold text-sm ${currency==='EUR'?'bg-white shadow text-fjord-600':'text-slate-500'}`}>EUR €</button>
                        </div>
                    </div>

                    {/* Converter Tool */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 transition-all ring-1 ring-slate-100">
                        <div className="flex justify-between items-center mb-3">
                            <label className="text-xs font-bold text-slate-400 uppercase flex items-center gap-1">
                                <Icons.Repeat size={12}/> Calculadora
                            </label>
                            <button 
                                onClick={() => setCalcMode(prev => prev === 'DKK_TO_EUR' ? 'EUR_TO_DKK' : 'DKK_TO_EUR')}
                                className="text-xs bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full text-fjord-600 font-bold flex items-center gap-1 transition-colors"
                            >
                                {calcMode === 'DKK_TO_EUR' ? '🇩🇰 DKK → 🇪🇺 EUR' : '🇪🇺 EUR → 🇩🇰 DKK'}
                            </button>
                        </div>
                        <div className="flex gap-2 items-center">
                            <input 
                                type="number" 
                                value={convAmount} 
                                onChange={(e)=>setConvAmount(e.target.value)}
                                placeholder={calcMode === 'DKK_TO_EUR' ? "Valor en coronas..." : "Valor en euros..."}
                                className="flex-1 border-b-2 border-slate-200 bg-transparent p-2 text-2xl font-bold text-slate-700 outline-none focus:border-fjord-500 placeholder:text-slate-300 transition-colors"
                            />
                        </div>
                        {convAmount && (
                            <div className="mt-3 text-right bg-emerald-50 p-3 rounded-lg border border-emerald-100 animate-slide-up">
                                 <span className="text-sm text-emerald-600 font-medium mr-2 uppercase tracking-wide">Es igual a:</span>
                                 <span className="text-3xl font-bold text-emerald-700">{getCalcResult()}</span>
                            </div>
                        )}
                    </div>

                    {/* Totals Card */}
                    <div className="bg-gradient-to-br from-fjord-600 to-fjord-800 rounded-2xl p-6 text-white shadow-lg mb-6 relative overflow-hidden">
                        <div className="relative z-10">
                            <p className="text-fjord-200 text-xs uppercase tracking-wider mb-1">Gasto Realizado</p>
                            <div className="text-4xl font-bold mb-4">
                                {currency === 'DKK' ? `${totalSpent.toFixed(0)} kr` : `€${totalSpent.toFixed(2)}`}
                            </div>
                            
                            {/* Progress Bar */}
                            <div className="w-full bg-black/20 h-2 rounded-full overflow-hidden mb-1">
                                <div className="h-full bg-emerald-400 transition-all duration-500" style={{width: `${Math.min(100, (totalSpent/totalBudget)*100)}%`}}></div>
                            </div>
                            <div className="flex justify-between text-xs text-fjord-200">
                                <span>0</span>
                                <span>Presupuesto: {currency === 'DKK' ? `${totalBudget.toFixed(0)}` : `€${totalBudget.toFixed(2)}`}</span>
                            </div>
                        </div>
                    </div>

                    {/* Planner List */}
                    <div className="space-y-3 pb-6">
                        <h3 className="font-bold text-slate-700 ml-1">Planificado</h3>
                        {costItems.map(item => (
                            <div key={item.id} onClick={()=>toggleCheck(item.id)} className="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center shadow-sm cursor-pointer active:scale-95 transition-transform select-none">
                                <div className="flex items-center gap-3">
                                    <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${checkedItems[item.id] ? 'bg-emerald-500 border-emerald-500' : 'border-slate-300'}`}>
                                        {checkedItems[item.id] && <span className="text-white text-xs font-bold">✓</span>}
                                    </div>
                                    <div>
                                        <p className={`font-medium ${checkedItems[item.id] ? 'text-slate-400 line-through' : 'text-slate-800'}`}>{item.title}</p>
                                        <p className="text-xs text-slate-500 capitalize">{item.type}</p>
                                    </div>
                                </div>
                                <span className="font-bold text-slate-700">
                                    {currency === 'DKK' ? `${item.priceDKK} kr` : `€${item.priceEUR}`}
                                </span>
                            </div>
                        ))}

                        {/* Manual Expenses List */}
                         {manualExpenses.length > 0 && manualExpenses.map(item => (
                            <div key={item.id} className="bg-slate-50 p-3 rounded-lg border border-slate-200 border-dashed flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <div className="w-6 h-6 rounded-full border-2 bg-emerald-500 border-emerald-500 flex items-center justify-center text-white text-xs font-bold">✓</div>
                                    <span className="font-medium text-slate-600">{item.title}</span>
                                </div>
                                <span className="font-bold text-slate-600">
                                    {currency === 'DKK' 
                                        ? `${convert(item.price, item.currency, 'DKK').toFixed(0)} kr` 
                                        : `€${convert(item.price, item.currency, 'EUR').toFixed(2)}`}
                                </span>
                            </div>
                        ))}

                        {/* Add Manual */}
                        <div className="mt-6 pt-4 border-t border-slate-200">
                            <h4 className="text-xs font-bold text-slate-400 uppercase mb-2">+ Añadir Gasto Extra</h4>
                            <div className="flex gap-2">
                                <input className="border rounded p-3 flex-1 text-sm outline-none focus:border-fjord-500" placeholder="Concepto (ej: Imán)" value={newItemName} onChange={e=>setNewItemName(e.target.value)} />
                                <input className="border rounded p-3 w-24 text-sm outline-none focus:border-fjord-500" type="number" placeholder="Precio" value={newItemPrice} onChange={e=>setNewItemPrice(e.target.value)} />
                                <button onClick={addManualExpense} className="bg-emerald-500 text-white px-4 rounded font-bold text-xl active:bg-emerald-600 transition-colors">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 3. MAP (Leaflet global)
        const MapComponent = ({ activities, userLocation, focusedLocation }) => {
            const mapRef = useRef(null);
            const mapInstance = useRef(null);
            const markersRef = useRef([]);

            useEffect(() => {
                if(!mapRef.current) return;
                if(mapInstance.current) return;

                const map = L.map(mapRef.current).setView([COORDS.LITTLE_MERMAID.lat, COORDS.LITTLE_MERMAID.lng], 13);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 18
                }).addTo(map);
                mapInstance.current = map;

                // Fix icons
                delete L.Icon.Default.prototype._getIconUrl;
                L.Icon.Default.mergeOptions({
                    iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                    iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                });
            }, []);

            useEffect(() => {
                const map = mapInstance.current;
                if(!map) return;

                // Clear
                markersRef.current.forEach(m => m.remove());
                markersRef.current = [];

                // Add activities
                activities.forEach(act => {
                    const m = L.marker([act.coords.lat, act.coords.lng])
                        .addTo(map)
                        .bindPopup(`<b>${act.title}</b><br/>${act.locationName}`);
                    markersRef.current.push(m);

                    if(act.endCoords) {
                         const line = L.polyline([
                             [act.coords.lat, act.coords.lng],
                             [act.endCoords.lat, act.endCoords.lng]
                         ], {color: 'blue', dashArray: '5,5'}).addTo(map);
                         markersRef.current.push(line);
                         
                         const m2 = L.marker([act.endCoords.lat, act.endCoords.lng])
                            .addTo(map)
                            .bindPopup(`<b>Fin: ${act.title}</b>`);
                         markersRef.current.push(m2);
                    }
                });

                // User
                if(userLocation) {
                    const userM = L.circleMarker([userLocation.lat, userLocation.lng], {
                        radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 2, fillOpacity: 1
                    }).addTo(map).bindPopup("Tú estás aquí");
                    markersRef.current.push(userM);
                }

            }, [activities, userLocation]);

            useEffect(() => {
                if(mapInstance.current && focusedLocation) {
                    mapInstance.current.flyTo([focusedLocation.lat, focusedLocation.lng], 16);
                }
            }, [focusedLocation]);

            return <div ref={mapRef} className="w-full h-full z-0" />;
        };

        // 4. GUIDE
        const Guide = ({ userLocation }) => {
            const [weather, setWeather] = useState(null);
            const [hourly, setHourly] = useState([]);
            const [daily, setDaily] = useState([]);
            const [sunData, setSunData] = useState({ sunrise: null, sunset: null });
            const [playing, setPlaying] = useState(null); // Track which word is playing
            const now = new Date();

            useEffect(() => {
                // Fetch Weather for Copenhagen (5 days)
                fetch('https://api.open-meteo.com/v1/forecast?latitude=55.67&longitude=12.56&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=5')
                    .then(r => r.json())
                    .then(data => {
                        setWeather(data.current);
                        setSunData({
                            sunrise: new Date(data.daily.sunrise[0]),
                            sunset: new Date(data.daily.sunset[0])
                        });

                        // Hourly logic (08:00 to 18:00)
                        if(data.hourly) {
                             const hours = data.hourly.time.map((t, i) => ({
                                 time: t,
                                 temp: data.hourly.temperature_2m[i],
                                 rain: data.hourly.precipitation_probability[i],
                                 code: data.hourly.weather_code[i]
                             }));
                             // Filter for today between 07:00 and 18:00
                             const usefulHours = hours.filter(h => {
                                 const d = new Date(h.time);
                                 const hNum = d.getHours();
                                 return hNum >= 8 && hNum <= 18; 
                             });
                             setHourly(usefulHours);
                        }

                        // Daily Logic (5 Days)
                        if(data.daily) {
                            const days = data.daily.time.map((t, i) => ({
                                date: new Date(t),
                                max: data.daily.temperature_2m_max[i],
                                min: data.daily.temperature_2m_min[i],
                                rain: data.daily.precipitation_probability_max[i],
                                code: data.daily.weather_code[i]
                            }));
                            setDaily(days);
                        }
                    })
                    .catch(e => console.log(e));
            }, []);

            // TTS Logic
            const playAudio = (word) => {
                if (!window.speechSynthesis) {
                    alert("Tu navegador no soporta audio.");
                    return;
                }
                
                // Cancel previous
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'da-DK'; // Danish
                utterance.rate = 0.8; // Slightly slower
                
                setPlaying(word);
                utterance.onend = () => setPlaying(null);
                
                window.speechSynthesis.speak(utterance);
            };

            // Visual Sun Chart
            const SunChart = () => {
                if(!sunData.sunrise) return null;
                const sunriseMins = sunData.sunrise.getHours()*60 + sunData.sunrise.getMinutes();
                const sunsetMins = sunData.sunset.getHours()*60 + sunData.sunset.getMinutes();
                const nowMins = now.getHours()*60 + now.getMinutes();
                
                const getPos = (mins) => (mins / 1440) * 100;

                return (
                    <div className="bg-slate-900 rounded-xl p-4 mb-6 relative h-28 overflow-hidden text-white shadow-lg">
                        <div className="absolute top-2 left-2 text-xs font-bold text-slate-400">CICLO SOLAR 24H</div>
                        
                        {/* Bars */}
                        <div className="absolute top-8 left-0 w-full h-8 flex">
                            {/* Night pre-dawn */}
                            <div className="h-full bg-slate-800" style={{width: `${getPos(sunriseMins)}%`}}></div>
                            {/* Daylight */}
                            <div className="h-full bg-gradient-to-r from-orange-400 via-sky-400 to-orange-400" style={{width: `${getPos(sunsetMins) - getPos(sunriseMins)}%`}}></div>
                            {/* Night post-sunset */}
                            <div className="h-full bg-slate-800 flex-1"></div>
                        </div>

                        {/* Markers */}
                        <div className="absolute top-16 w-full h-6 text-[10px] text-slate-300">
                             <div className="absolute -translate-x-1/2 flex flex-col items-center" style={{left: `${getPos(sunriseMins)}%`}}>
                                <Icons.Sun size={12} className="text-orange-300"/>
                                <span>{sunData.sunrise.toLocaleTimeString([],{hour:'2-digit', minute:'2-digit'})}</span>
                             </div>
                             <div className="absolute -translate-x-1/2 flex flex-col items-center" style={{left: `${getPos(sunsetMins)}%`}}>
                                <Icons.Moon size={12} className="text-orange-300"/>
                                <span>{sunData.sunset.toLocaleTimeString([],{hour:'2-digit', minute:'2-digit'})}</span>
                             </div>
                        </div>

                        {/* NOW Line */}
                        <div className="absolute top-6 bottom-0 w-0.5 bg-red-500 z-10 shadow-[0_0_5px_rgba(239,68,68,0.8)]" style={{left: `${getPos(nowMins)}%`}}>
                            <div className="absolute -top-1 -translate-x-1/2 bg-red-500 text-white text-[8px] font-bold px-1 rounded">AHORA</div>
                        </div>
                    </div>
                );
            };

            const getWeatherIcon = (code) => {
                 if(code <= 3) return <Icons.Sun size={20} className="text-orange-400"/>;
                 if(code >= 45 && code <= 48) return <Icons.Cloud size={20} className="text-slate-400"/>;
                 return <Icons.CloudRain size={20} className="text-blue-500"/>;
            };

            const getDayName = (date) => {
                return date.toLocaleDateString('es-ES', {weekday: 'short'}).replace('.','');
            };

            return (
                <div className="pb-24 px-4 pt-6 max-w-lg mx-auto overflow-y-auto h-full">
                    {/* SOS & Tools */}
                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <button 
                             onClick={() => {
                                 const txt = `🆘 SOS! Necesito ayuda en Copenhague. Mi ubicación: https://maps.google.com/?q=${userLocation?.lat},${userLocation?.lng}`;
                                 window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
                             }}
                             className="bg-red-600 text-white p-4 rounded-xl shadow-lg flex flex-col items-center justify-center animate-pulse active:scale-95"
                        >
                            <span className="text-2xl font-bold">SOS</span>
                            <span className="text-xs mt-1">Emergencia</span>
                        </button>
                        
                        <div className="space-y-2">
                            <button 
                                onClick={() => window.open('https://play.google.com/store/apps/details?id=com.google.android.apps.translate', '_blank')}
                                className="bg-blue-600 text-white p-2 rounded-lg w-full flex items-center justify-center gap-2 text-xs font-bold shadow"
                            >
                                <Icons.Camera size={16}/> Traductor Visual
                            </button>
                            <button 
                                onClick={() => window.open('https://play.google.com/store/apps/details?id=com.msccruises.mscforme', '_blank')}
                                className="bg-white border border-slate-300 text-slate-700 p-2 rounded-lg w-full flex items-center justify-center gap-2 text-xs font-bold"
                            >
                                MSC for Me
                            </button>
                        </div>
                    </div>

                    <SunChart />

                    {/* Hourly Weather */}
                    {hourly.length > 0 && (
                        <div className="mb-6">
                            <h3 className="font-bold text-slate-700 mb-2">Pronóstico Hora a Hora (Hoy)</h3>
                            <div className="flex overflow-x-auto gap-3 pb-2 snap-x">
                                {hourly.map((h, i) => (
                                    <div key={i} className="flex-shrink-0 w-20 bg-white border border-slate-200 p-3 rounded-lg flex flex-col items-center snap-center shadow-sm">
                                        <span className="text-xs font-bold text-slate-500 mb-1">
                                            {new Date(h.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                                        </span>
                                        {h.rain > 30 ? <Icons.CloudRain className="text-blue-500 mb-1"/> : <Icons.Sun className="text-orange-400 mb-1"/>}
                                        <span className="font-bold text-lg">{h.temp}°</span>
                                        <span className="text-[10px] text-blue-500 font-bold">{h.rain}% 💧</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 5-Day Forecast */}
                    {daily.length > 0 && (
                        <div className="mb-8 bg-white rounded-xl shadow-sm border border-slate-200 p-4">
                            <h3 className="font-bold text-slate-700 mb-3 flex items-center gap-2">
                                <Icons.CalendarClock size={18}/> Previsión 5 Días
                            </h3>
                            <div className="space-y-3">
                                {daily.map((day, i) => (
                                    <div key={i} className="flex justify-between items-center text-sm border-b border-slate-50 last:border-0 pb-2 last:pb-0">
                                        <div className="w-16 font-bold text-slate-600 capitalize">{getDayName(day.date)}</div>
                                        <div className="flex items-center gap-2 flex-1 justify-center">
                                            {getWeatherIcon(day.code)}
                                            {day.rain > 20 && <span className="text-xs text-blue-500 font-bold">{day.rain}%</span>}
                                        </div>
                                        <div className="w-20 text-right">
                                            <span className="font-bold text-slate-800">{Math.round(day.max)}°</span>
                                            <span className="text-slate-400 mx-1">/</span>
                                            <span className="text-slate-500">{Math.round(day.min)}°</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Dictionary */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div className="bg-slate-50 p-3 border-b border-slate-200 font-bold text-slate-700">Diccionario Danés Exprés</div>
                        {DANISH_DICT.map((d, i) => (
                            <div key={i} className="p-3 border-b last:border-0 border-slate-100 flex justify-between items-center">
                                <div>
                                    <p className="font-bold text-fjord-600 text-lg">{d.word}</p>
                                    <p className="text-xs text-slate-500 italic">{d.phonetic}</p>
                                </div>
                                <div className="text-right flex flex-col items-end">
                                    <span className="text-sm font-medium text-slate-700 mb-1">{d.meaning}</span>
                                    <button 
                                        onClick={() => playAudio(d.word)}
                                        className={`p-2 rounded-full transition-colors flex items-center gap-1 text-xs font-bold ${playing === d.word ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                                    >
                                        <Icons.Volume2 size={16} className={playing === d.word ? 'animate-pulse' : ''} />
                                        {playing === d.word ? 'Oyendo...' : 'Oír'}
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                    
                    <div className="mt-8 text-center text-xs text-slate-400 pb-4">
                        Actualizado: 04 Dic 2025<br/>
                        © 2025-2026 Gonzalo Arenas de la Hoz
                    </div>
                </div>
            );
        };

        // --- APP ---
        const App = () => {
            const [itinerary, setItinerary] = useState(INITIAL_ITINERARY);
            const [tab, setTab] = useState('timeline');
            const [userLoc, setUserLoc] = useState(null);
            const [mapFocus, setMapFocus] = useState(null);
            const [countdown, setCountdown] = useState('');
            const [modalAct, setModalAct] = useState(null); // Detail Modal

            // Load/Save
            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if(saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        // Merge completed status only
                        const merged = INITIAL_ITINERARY.map(init => {
                            const found = parsed.find(p => p.id === init.id);
                            return found ? {...init, completed: found.completed} : init;
                        });
                        setItinerary(merged);
                    } catch(e) { console.log(e); }
                } else {
                    // Force initial save for new key
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(INITIAL_ITINERARY));
                }
            }, []);

            const updateItinerary = (newIt) => {
                setItinerary(newIt);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(newIt));
            };

            const toggleComplete = (id) => {
                updateItinerary(itinerary.map(a => a.id === id ? {...a, completed: !a.completed} : a));
            };

            // Geo
            useEffect(() => {
                if(navigator.geolocation) {
                    const id = navigator.geolocation.watchPosition(
                        p => setUserLoc({lat: p.coords.latitude, lng: p.coords.longitude}),
                        e => console.log(e),
                        {enableHighAccuracy: true}
                    );
                    return () => navigator.geolocation.clearWatch(id);
                }
            }, []);

            // Countdown to ONBOARD TIME (17:30)
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const [h, m] = SHIP_ONBOARD_TIME.split(':').map(Number);
                    const target = new Date();
                    target.setHours(h, m, 0);
                    
                    // Logic: If before 8AM, count to Arrival. If after, count to Onboard.
                    const [arrH, arrM] = SHIP_ARRIVAL_TIME.split(':').map(Number);
                    const arrival = new Date();
                    arrival.setHours(arrH, arrM, 0);

                    if (now < arrival) {
                        // Counting to arrival
                        const diff = arrival - now;
                        const hh = Math.floor(diff / 3600000);
                        const mm = Math.floor((diff % 3600000) / 60000);
                        setCountdown(`Llegada en ${hh}h ${mm}m`);
                    } else {
                        // Counting to onboard
                        const diff = target - now;
                        if(diff <= 0) setCountdown("¡A BORDO!");
                        else {
                            const hh = Math.floor(diff / 3600000);
                            const mm = Math.floor((diff % 3600000) / 60000);
                            const ss = Math.floor((diff % 60000) / 1000);
                            setCountdown(`${hh}h ${mm}m ${ss}s`);
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <div className="flex flex-col h-full font-sans">
                    {/* Top Bar */}
                    <header className="bg-fjord-900 text-white p-3 shadow z-20 flex justify-between items-center shrink-0">
                        <div className="flex flex-col">
                            <span className="text-[10px] text-sunset-500 font-bold tracking-widest uppercase">Todos a bordo: {SHIP_ONBOARD_TIME}</span>
                            <span className="text-xs text-fjord-200">Salida: {SHIP_DEPARTURE_TIME}</span>
                        </div>
                        <div className="text-xl font-mono font-bold text-white tabular-nums">
                            {countdown}
                        </div>
                    </header>

                    {/* Main */}
                    <main className="flex-1 relative overflow-hidden bg-slate-50 h-full">
                        {tab === 'timeline' && (
                            <div className="h-full overflow-y-auto">
                                <Timeline 
                                    itinerary={itinerary} 
                                    onToggleComplete={toggleComplete} 
                                    onLocate={(coords) => { setMapFocus(coords); setTab('map'); }}
                                    onShowDetails={setModalAct}
                                    userLocation={userLoc}
                                />
                            </div>
                        )}
                        {tab === 'map' && (
                            <MapComponent 
                                activities={itinerary} 
                                userLocation={userLoc} 
                                focusedLocation={mapFocus} 
                            />
                        )}
                        {tab === 'budget' && <Budget itinerary={itinerary} />}
                        {tab === 'guide' && <Guide userLocation={userLoc} />}
                    </main>

                    {/* Nav */}
                    <nav className="bg-white border-t border-slate-200 pb-safe shrink-0 z-30">
                        <div className="flex justify-around items-center h-16">
                            {[
                                {id: 'timeline', icon: Icons.CalendarClock, label: 'Itinerario'},
                                {id: 'map', icon: Icons.MapIcon, label: 'Mapa'},
                                {id: 'budget', icon: Icons.Wallet, label: 'Gastos'},
                                {id: 'guide', icon: Icons.BookOpen, label: 'Guía'}
                            ].map(item => (
                                <button 
                                    key={item.id}
                                    onClick={() => setTab(item.id)}
                                    className={`flex flex-col items-center w-full h-full justify-center transition-colors ${tab === item.id ? 'text-fjord-600' : 'text-slate-400'}`}
                                >
                                    <item.icon size={24} />
                                    <span className="text-[10px] font-bold mt-1">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* MODAL DETAIL */}
                    {modalAct && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm" onClick={() => setModalAct(null)}>
                            <div className="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-2xl animate-slide-up" onClick={e => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-4">
                                    <h3 className="text-2xl font-bold text-slate-800">{modalAct.title}</h3>
                                    <button onClick={() => setModalAct(null)} className="p-2 bg-slate-100 rounded-full">✕</button>
                                </div>
                                
                                <div className="space-y-4 max-h-[70vh] overflow-y-auto">
                                    <div className="bg-fjord-50 p-3 rounded-lg border border-fjord-100 text-sm text-fjord-800 italic">
                                        "{modalAct.keyDetails}"
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-slate-700 mb-1">Descripción</h4>
                                        <p className="text-slate-600 leading-relaxed">{modalAct.fullDescription}</p>
                                    </div>

                                    <div>
                                        <h4 className="font-bold text-orange-600 mb-1">Consejo Pro</h4>
                                        <p className="text-slate-600 text-sm bg-orange-50 p-2 rounded border border-orange-100">{modalAct.tips}</p>
                                    </div>

                                    {/* Action Buttons in Modal */}
                                    <div className="grid grid-cols-1 gap-2 pt-4">
                                        {modalAct.googleMapsUrl && (
                                            <button 
                                                onClick={() => window.open(modalAct.googleMapsUrl, '_blank')}
                                                className="w-full py-3 bg-green-600 text-white rounded-xl font-bold shadow-md flex justify-center items-center gap-2"
                                            >
                                                🗺️ Ver Recorrido (Google Maps)
                                            </button>
                                        )}
                                        {modalAct.ticketUrl && (
                                            <button 
                                                onClick={() => window.open(modalAct.ticketUrl, '_blank')}
                                                className="w-full py-3 bg-fjord-600 text-white rounded-xl font-bold shadow-md flex justify-center items-center gap-2"
                                            >
                                                <Icons.Ticket /> Comprar Tickets Online
                                            </button>
                                        )}
                                        {modalAct.instaTag && (
                                            <button 
                                                onClick={() => window.open(modalAct.instaTag, '_blank')}
                                                className="w-full py-3 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 text-white rounded-xl font-bold shadow-md flex justify-center items-center gap-2"
                                            >
                                                <Icons.Instagram /> Ver Fotos (Instagram)
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
